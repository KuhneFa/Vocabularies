<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f3f8f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#07100b" media="(prefers-color-scheme: dark)" />
		<script>
			// apply the stored Tag-/Nachtmodus before the first paint
			try {
				var mode = localStorage.getItem('vokabel-mode');
				if (mode) document.documentElement.dataset.mode = mode;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
